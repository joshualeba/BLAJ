<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto | BLAJ</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Shared CSS -->
    <link rel="stylesheet" href="css/index.css">
    <style>
        :root {
            --project-accent: #0084FF;
        }
        body {
            background-color: var(--current-bg-color);
            color: var(--current-text-color);
            overflow-x: hidden;
        }
        .project-hero {
            padding: 120px 0 60px;
            position: relative;
            overflow: hidden;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--current-text-color);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 40px;
            opacity: 0.7;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            opacity: 1;
            transform: translateX(-5px);
            color: var(--project-accent);
        }
        .project-title-premium {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        .project-intro {
            font-size: 1.25rem;
            line-height: 1.8;
            opacity: 0.85;
            margin-bottom: 50px;
            max-width: 800px;
            font-weight: 300;
        }
        .project-image-container {
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            border: 1px solid var(--current-border-color);
            background: rgba(255,255,255,0.05);
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 80px;
        }
        .gallery-item {
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--current-border-color);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }
        .gallery-item:hover {
            transform: scale(1.03);
            border-color: var(--project-accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery-caption {
            padding: 15px;
            background: var(--current-card-bg);
            font-size: 0.9rem;
            text-align: center;
            opacity: 0.8;
            font-weight: 500;
        }
    </style>
    <script>
        if (window.history.replaceState) {
            let cleanUrl = window.location.pathname.replace(/\.html$/, '') + window.location.search;
            if (window.location.pathname.endsWith('.html') || window.location.hash) {
                window.history.replaceState(null, '', cleanUrl);
            }
        }
    </script>
</head>
<body class="dark-mode">
    
    
    <div style="position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 15px; align-items: center; background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);">
        <label class="ui-switch">
            <input type="checkbox" id="theme-toggle">
            <div class="slider"><div class="circle"></div></div>
        </label>
        <div class="lang-toggle-wrapper">
            <button id="lang-toggle-btn" class="lang-btn" onclick="toggleLanguageCustom()" aria-label="Cambiar idioma">
                <img id="lang-flag" src="https://flagcdn.com/w20/es.png" alt="ES" class="lang-flag">
                <span id="lang-text">ES</span>
            </button>
        </div>
    </div>
    <div id="page-wrapper">
        <section class="project-hero">
            <div class="container text-start">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Volver al portafolio
                </a>
                
                <h1 id="project-title" class="project-title-premium">Cargando proyecto...</h1>
                <p id="project-intro" class="project-intro"></p>
                
                <div class="project-image-container">
                    <img id="project-main-image" src="" alt="detalles del proyecto">
                </div>

                <div class="row details-grid" id="project-details">
                    <!-- Dynamic details here -->
                </div>

                <div id="gallery-wrapper" style="display: none;">
                    <h2 class="mb-5 text-center fw-bold" style="letter-spacing: -1px;">Explora el proceso</h2>
                    <div class="gallery-container" id="project-gallery">
                        <!-- Gallery items -->
                    </div>
                </div>
            </div>
        </section>

        <section class="cta-section-project">
            <div class="container">
                <h2 class="mb-4">¿Te gustaría resultados similares?</h2>
                <a id="project-url" href="#" target="_blank" class="btn-visit">Visitar sitio web</a>
            </div>
        </section>
    </div>

    <!-- Footer same as index.html -->
    <footer class="footer-custom mt-5">
        <div class="container">
            <div class="text-center">
                <p class="footer-copyright">&copy; 2026 BLAJ. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <script>
        const projects = {
            macrame: {
                title: "Macramé Creativo",
                intro: "Logramos monetizar la pasión de la creadora, aumentando sus ventas con un embudo optimizado y copywriting persuasivo enfocado en resultados reales.",
                image: "https://res.cloudinary.com/dpvm2gro2/image/upload/v1768845813/macramecreativo_agftq2.jpg",
                url: "https://macramecreativo.netlify.app/",
                details: [
                    { icon: "fas fa-funnel-dollar", title: "Embudo de conversión", desc: "Landing page optimizada para convertir visitantes en compradores directos del infoproducto." },
                    { icon: "fas fa-bullseye", title: "Copywriting persuasivo", desc: "Mensaje estratégico enfocado en la transformación del usuario ('del primer nudo al primer ingreso')." },
                    { icon: "fas fa-stopwatch", title: "Gatillos mentales", desc: "Implementación de urgencia, prueba social y garantías para maximizar el ROI." }
                ]
            },

            krosa: {
                title: "Krosa Construcción Industrial",
                intro: "Cómo transformamos la identidad digital de una constructora líder para proyectar la solvencia y el rigor técnico que exigen las grandes licitaciones corporativas y gubernamentales.",
                image: "https://res.cloudinary.com/dpvm2gro2/image/upload/q_auto/f_auto/v1775602749/27b179ab-6dad-4f98-a949-0d417a549f2e.png",
                url: "https://krosa.netlify.app/",
                details: [
                    { icon: "fas fa-building", title: "Autoridad B2B", desc: "Imagen corporativa diseñada para transmitir seriedad absoluta ante grandes corporativos y gobierno." },
                    { icon: "fas fa-industry", title: "Portafolio de Licitación", desc: "Plataforma optimizada para mostrar proyectos de obra pública y plantas industriales con rigor técnico." },
                    { icon: "fas fa-chart-line", title: "SEO Industrial", desc: "Estrategia de posicionamiento enfocada en los términos clave utilizados por los directores de proyectos." }
                ],
                gallery: [
                    { src: "https://res.cloudinary.com/dpvm2gro2/image/upload/q_auto/f_auto/v1775605812/4091032d-df24-4647-acff-c4cc00bd7b93.png", caption: "Visión Global: La nueva era del diseño industrial." },
                    { src: "https://res.cloudinary.com/dpvm2gro2/image/upload/q_auto/f_auto/v1775605834/ddda7a06-9af6-4e69-9c48-9232fa6a2988.png", caption: "Arquitectura de Información: Estructura lógica y profesional." },
                    { src: "https://res.cloudinary.com/dpvm2gro2/image/upload/q_auto/f_auto/v1775605861/5296757c-dc77-4932-8c3d-e62f62dc3201.png", caption: "Excelencia Técnica: Presentación de servicios de ingeniería." },
                    { src: "https://res.cloudinary.com/dpvm2gro2/image/upload/q_auto/f_auto/v1775605883/912136a2-01bc-4236-b749-6aa0a084348d.png", caption: "Interfaces Intuitivas: Navegación fluida y ejecutiva." },
                    { src: "https://res.cloudinary.com/dpvm2gro2/image/upload/q_auto/f_auto/v1775605912/2cfa46cb-a7bf-43de-a9fb-e811b534c697.png", caption: "Confianza Corporativa: Narrativa de marca sólida." },
                    { src: "https://res.cloudinary.com/dpvm2gro2/image/upload/q_auto/f_auto/v1775605937/937489c9-3bcc-4fc4-a5f1-22b0908ce5dc.png", caption: "Galería de Proyectos: El respaldo de la experiencia." },
                    { src: "https://res.cloudinary.com/dpvm2gro2/image/upload/q_auto/f_auto/v1775605964/79995852-9cd6-401f-a8b4-f7cf62d92a4e.png", caption: "Rendimiento Premium: Rapidez y solvencia técnica." },
                    { src: "https://res.cloudinary.com/dpvm2gro2/image/upload/q_auto/f_auto/v1775605986/7d7189eb-c3d5-4ca7-8dbf-c9c3db9903c5.png", caption: "Resultados Tangibles: El nuevo estándar industrial." }
                ]
            },
            sht: {
                title: "SHT Soluciones",
                intro: "Modernizamos una empresa con 50 años de legado industrial, equilibrando su rica historia con una presencia digital enfocada en generar cotizaciones activas.",
                image: "https://res.cloudinary.com/dpvm2gro2/image/upload/q_auto/f_auto/v1775602793/68722d6b-1c36-45e7-b32f-0b1e5d891a60.png",
                url: "https://shtijerina.com/",
                details: [
                    { icon: "fas fa-laptop-code", title: "Transformación Digital", desc: "Actualización completa del ecosistema digital de una marca tradicional." },
                    { icon: "fas fa-robot", title: "Generación de leads", desc: "Integración de asistentes virtuales y formularios inteligentes para capturar prospectos industriales." },
                    { icon: "fas fa-medal", title: "Legado de confianza", desc: "Narrativa de marca basada en la experiencia de dos generaciones de ingeniería." }
                ]
            }
        };

        // Load project from URL
        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('id');
        const project = projects[projectId];

        if (project) {
            document.title = `${project.title} | BLAJ`;
            document.getElementById('project-title').textContent = project.title;
            document.getElementById('project-intro').textContent = project.intro;
            document.getElementById('project-main-image').src = project.image;
            document.getElementById('project-url').href = project.url;

            const detailsGrid = document.getElementById('project-details');
            project.details.forEach(detail => {
                const col = document.createElement('div');
                col.className = 'col-lg-4 mb-4';
                col.innerHTML = `
                    <div class="detail-card-premium">
                        <i class="${detail.icon}"></i>
                        <h3>${detail.title}</h3>
                        <p>${detail.desc}</p>
                    </div>
                `;
                detailsGrid.appendChild(col);
            });

            // Display Gallery if exists
            if (project.gallery && project.gallery.length > 0) {
                const galleryWrapper = document.getElementById('gallery-wrapper');
                const galleryContainer = document.getElementById('project-gallery');
                galleryWrapper.style.display = 'block';

                project.gallery.forEach(item => {
                    const galleryItem = document.createElement('div');
                    galleryItem.className = 'gallery-item';
                    galleryItem.innerHTML = `
                        <img src="${item.src}" alt="${item.caption}" loading="lazy">
                        <div class="gallery-caption">${item.caption}</div>
                    `;
                    galleryContainer.appendChild(galleryItem);
                });
            }
        } else {
            window.location.href = 'index.html';
        }
    </script>
    <script src="js/i18n.js"></script>
</body>
</html>
